<!doctype html><meta charset="utf-8"><body><pre id="out">running</pre>
<link rel="stylesheet" href="./tubeMap.css">
<link href="https://fonts.googleapis.com/css?family=Hammersmith+One" rel="stylesheet">
<div id="host"></div>
<script src="https://cdn.jsdelivr.net/npm/d3@6.7.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-tube-map@1.5.0/dist/d3-tube-map.js"></script>
<script>
function measure(file) {
  return d3.json(file).then(function (data) {
    var host = d3.select('#host').append('div');
    host.datum(data).call(d3.tubeMap().width(4000).height(2500).margin({top:40,right:40,bottom:40,left:40}));
    var svg = host.select('svg');

    var rects = [];
    svg.selectAll('text').each(function () {
      var b = this.getBBox();
      if (b.width) rects.push({x0:b.x, y0:b.y, x1:b.x+b.width, y1:b.y+b.height});
    });

    // bucket the label rectangles so a point test is cheap
    var CELL = 40, grid = new Map();
    rects.forEach(function (r, i) {
      for (var gx = Math.floor(r.x0/CELL); gx <= Math.floor(r.x1/CELL); gx++)
        for (var gy = Math.floor(r.y0/CELL); gy <= Math.floor(r.y1/CELL); gy++) {
          var k = gx+','+gy; if (!grid.has(k)) grid.set(k, []); grid.get(k).push(i);
        }
    });

    var hit = new Set();
    svg.selectAll('g.lines path').each(function () {
      var len = this.getTotalLength();
      for (var d = 0; d <= len; d += 3) {
        var p = this.getPointAtLength(d);
        var k = Math.floor(p.x/CELL)+','+Math.floor(p.y/CELL);
        var cand = grid.get(k); if (!cand) continue;
        for (var j = 0; j < cand.length; j++) {
          var r = rects[cand[j]];
          if (p.x >= r.x0 && p.x <= r.x1 && p.y >= r.y0 && p.y <= r.y1) hit.add(cand[j]);
        }
      }
    });

    var pairs = 0, inPair = new Set();
    grid.forEach(function (list) {
      for (var a = 0; a < list.length; a++) for (var b = a+1; b < list.length; b++) {
        var r = rects[list[a]], q = rects[list[b]];
        if (!(r.x1 <= q.x0 || q.x1 <= r.x0 || r.y1 <= q.y0 || q.y1 <= r.y0)) {
          inPair.add(list[a]); inPair.add(list[b]);
        }
      }
    });
    var seen = new Set();
    grid.forEach(function (list) {
      for (var a = 0; a < list.length; a++) for (var b = a+1; b < list.length; b++) {
        var r = rects[list[a]], q = rects[list[b]];
        if (!(r.x1 <= q.x0 || q.x1 <= r.x0 || r.y1 <= q.y0 || q.y1 <= r.y0)) {
          var key = Math.min(list[a],list[b])+':'+Math.max(list[a],list[b]);
          if (!seen.has(key)) { seen.add(key); pairs++; }
        }
      }
    });
    host.remove();
    return file.padEnd(16) + String(rects.length).padStart(6) +
           String(hit.size).padStart(12) + ('(' + Math.round(100*hit.size/rects.length) + '%)').padStart(7) +
           String(inPair.size).padStart(12) + String(pairs).padStart(9);
  });
}
setTimeout(function () {
  Promise.all([measure('./_before.json'), measure('./map.json')]).then(function (rows) {
    document.getElementById('out').textContent =
      ['file              labels  touching a line        in a pair  pairs'].concat(rows).join('\n');
  }).catch(function (e) { document.getElementById('out').textContent = 'error: ' + e; });
}, 1500);
</script>
