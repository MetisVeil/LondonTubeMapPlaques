<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>London tube map</title>
    <link rel="stylesheet" href="./tubeMap.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Hammersmith+One"
      rel="stylesheet"
      type="text/css"
    />
    <!-- d3-tube-map 1.5.0 peer-depends on d3 "5 - 6"; v7 breaks it. -->
    <script src="https://cdn.jsdelivr.net/npm/d3@6.7.0/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-tube-map@1.5.0/dist/d3-tube-map.js"></script>
  </head>

  <body>
    <div id="tube-map"></div>

    <div id="categories">
      <button id="category-toggle" aria-haspopup="true" aria-expanded="false">
        <span id="category-name">Tube map</span><span class="triangle">&#9662;</span>
      </button>
      <div id="category-menu" hidden></div>
    </div>

    <div id="options">
      <button id="options-toggle" aria-haspopup="true" aria-expanded="false">
        <span>Options</span><span class="triangle">&#9662;</span>
      </button>
      <div id="options-menu" hidden>
        <label class="option">
          <input type="checkbox" id="overground-toggle" /><span>Overground lines</span>
        </label>
        <label class="option">
          <input type="checkbox" id="dark-toggle" /><span>Dark mode</span>
        </label>
      </div>
    </div>

    <div id="selection"><span class="hint">Click a station</span></div>

    <script>
      var container = d3.select('#tube-map');
      var selection = d3.select('#selection');
      var toggle = document.getElementById('category-toggle');
      var menu = document.getElementById('category-menu');

      var map = d3
        .tubeMap()
        .width(window.innerWidth)
        .height(window.innerHeight)
        .margin({ top: 40, right: 40, bottom: 40, left: 40 });

      var svg, root, data, names = {}, themes = null, showing = null, initialViewApplied = false;
      var options = document.getElementById('options-toggle');
      var optionsMenu = document.getElementById('options-menu');
      var overgroundBox = document.getElementById('overground-toggle');
      var darkBox = document.getElementById('dark-toggle');
      var overground = false;
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var initialBounds = {
        left: 'ShepherdsBush',
        right: 'CanadaWater',
        south: 'SouthWimbledon',
        north: 'StJohnsWood',
        center: 'GreenPark'
      };

      var zoom = d3.zoom().on('zoom', function (event) {
        if (root) root.attr('transform', event.transform.toString());
      });

      function fitBox(box) {
        var width = window.innerWidth;
        var height = window.innerHeight;
        if (!box || !box.width || !box.height) return;

        // Fill the window rather than fitting inside it: take the larger of
        // the two ratios, so whichever axis has the most room to spare is the
        // one that gets used up, and the other overflows and is panned to.
        // That leaves no whitespace around the map whatever shape the window is.
        var contain = Math.min(width / box.width, height / box.height);
        var scale = Math.max(width / box.width, height / box.height);

        // Zooming out has to reach past the fill, or the ends of the lines
        // would be stranded off-screen with no way back to the whole map.
        zoom.scaleExtent([contain * 0.5, scale * 24]);
        svg.call(
          zoom.transform,
          d3.zoomIdentity
            .translate(width / 2 - scale * (box.x + box.width / 2),
                       height / 2 - scale * (box.y + box.height / 2))
            .scale(scale)
        );
      }

      // Fit the drawing to the window rather than picking a scale by hand.
      // getBBox measures what was actually drawn - labels included, which
      // stick out well past the lines - and it ignores the group's own
      // transform, so it stays correct however far the map has been zoomed.
      function fit() {
        if (!root || !root.node()) return;
        fitBox(root.node().getBBox());
      }

      function fitToBounds(bounds) {
        if (!root || !root.node() || !data || !data.stations) return false;

        var keys = [bounds.left, bounds.right, bounds.north, bounds.south, bounds.center];
        var boxes = [];

        keys.forEach(function (key) {
          if (!key || !data.stations[key]) return;
          var node = root.select('#' + key).node();
          if (!node) return;

          var box = node.getBBox();
          if (box && box.width && box.height) boxes.push(box);
        });

        if (!boxes.length) return false;

        var xMin = d3.min(boxes, function (box) { return box.x; });
        var xMax = d3.max(boxes, function (box) { return box.x + box.width; });
        var yMin = d3.min(boxes, function (box) { return box.y; });
        var yMax = d3.max(boxes, function (box) { return box.y + box.height; });

        var greenBox = root.select('#' + bounds.center).node();
        var green = greenBox ? greenBox.getBBox() : null;
        var centerX = green ? green.x + green.width / 2 : (xMin + xMax) / 2;
        var centerY = green ? green.y + green.height / 2 : (yMin + yMax) / 2;
        var boxWidth = xMax - xMin;
        var boxHeight = yMax - yMin;
        var padX = Math.max(boxWidth * 0.55, 140);
        var padY = Math.max(boxHeight * 0.55, 120);

        fitBox({
          x: centerX - (boxWidth / 2 + padX),
          y: centerY - (boxHeight / 2 + padY),
          width: boxWidth + padX * 2,
          height: boxHeight + padY * 2
        });
        return true;
      }

      // The backdrop the dark theme paints, and the smallest contrast a line has
      // to reach against it to still read as a line. Kept in step with --paper
      // and --ink in the stylesheet.
      var DARK_PAPER = 0.0086, DARK_INK = '#e6e9f5', MIN_CONTRAST = 3;

      function luminance(rgb) {
        return rgb.reduce(function (total, value, i) {
          value /= 255;
          value = value <= 0.03928 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
          return total + [0.2126, 0.7152, 0.0722][i] * value;
        }, 0);
      }

      // TfL's palette is the map, so the dark theme repaints as little of it as
      // it can get away with: a colour bright enough to see is left exactly as
      // it is, and one that is not gets mixed towards white by the smallest
      // step that clears MIN_CONTRAST. Black is the exception, because no
      // mixture of it is still black - it is ink rather than a colour, and like
      // the labels it simply flips with the page.
      var lifted = {};

      function contrast(rgb) {
        return (luminance(rgb) + 0.05) / (DARK_PAPER + 0.05);
      }

      function lift(color) {
        if (lifted[color]) return lifted[color];

        var base = [1, 3, 5].map(function (i) { return parseInt(color.substr(i, 2), 16); });
        var mixed = base;

        if (luminance(base) < 0.02) return (lifted[color] = DARK_INK);

        for (var t = 0.05; t <= 1 && contrast(mixed) < MIN_CONTRAST; t += 0.05) {
          mixed = base.map(function (value) { return value + (255 - value) * t; });
        }

        return (lifted[color] = '#' + mixed.map(function (value) {
          return ('0' + Math.round(value).toString(16)).slice(-2);
        }).join(''));
      }

      // What to hand the library: the tube on its own unless the overground has
      // been asked for. It reads every key of stations, and a station left with
      // no line through it has no marker to read, so the stations have to be cut
      // down to match the lines. It also *appends* to the markers it finds
      // already on a station, so last draw's have to go, or a line that is no
      // longer drawn would keep its ticks on the map.
      function shown() {
        var lines = data.lines.filter(function (line) {
          return overground || line.mode !== 'overground';
        }).map(function (line) {
          // A copy, so the theme can be turned back off again.
          return dark ? Object.assign({}, line, { color: lift(line.color) }) : line;
        });
        var stations = {}, through = {};

        lines.forEach(function (line) {
          line.nodes.forEach(function (node) {
            if (!node.name) return;
            stations[node.name] = data.stations[node.name];
            delete stations[node.name].marker;
            (through[node.name] = through[node.name] || {})[line.label] = true;
          });
        });

        // An interchange is a station where you can change, so it is the lines
        // actually drawn that decide it: a tube stop that only meets the
        // overground is an ordinary stop once the overground is gone.
        lines.forEach(function (line) {
          line.nodes.forEach(function (node) {
            if (!node.name) return;
            if (Object.keys(through[node.name]).length > 1) node.marker = 'interchange';
            else delete node.marker;
          });
        });

        return { stations: stations, lines: lines };
      }

      // The library draws its labels once, into nested tspans, so changing the
      // names means drawing the map again. The view is put back afterwards, so
      // switching category leaves you looking at the same place.
      function draw(keepView) {
        var was = svg ? d3.zoomTransform(svg.node()) : null;
        container.selectAll('svg').remove();
        container.datum(shown()).call(map);

        svg = container.select('svg');
        root = svg.select('g');
        svg.call(zoom);

        if (was && keepView) svg.call(zoom.transform, was);
        else if (!initialViewApplied && fitToBounds(initialBounds)) {
          initialViewApplied = true;
        } else {
          fit();
        }

        // Fade the stations this theme has nobody for, so what it covers reads
        // at a glance rather than having to be picked out of the real names.
        svg.selectAll('g.labels > g').style('opacity', function () {
          if (!showing) return 1;
          return showing.stations[this.getAttribute('id')] ? 1 : 0.22;
        });
      }

      function show(theme) {
        showing = theme;
        Object.keys(data.stations).forEach(function (key) {
          var named = theme && theme.stations[key];
          data.stations[key].label = named ? named.label : names[key];
        });
        document.getElementById('category-name').textContent = theme ? theme.name : 'Tube map';
        draw(true);
      }

      function buildMenu() {
        menu.innerHTML = '';
        var groups = {};
        themes.forEach(function (theme) {
          (groups[theme.group || 'Whole map'] = groups[theme.group || 'Whole map'] || []).push(theme);
        });

        function item(label, count, theme) {
          var row = document.createElement('button');
          row.className = 'category-item';
          row.innerHTML = '<span>' + label + '</span>' +
                          (count === null ? '' : '<span class="count">' + count + '</span>');
          row.onclick = function () { show(theme); close(); };
          menu.appendChild(row);
        }

        item('Tube map', null, null);
        Object.keys(groups).forEach(function (name) {
          var heading = document.createElement('div');
          heading.className = 'category-group';
          heading.textContent = name;
          menu.appendChild(heading);
          groups[name].forEach(function (theme) {
            item(theme.name, Object.keys(theme.stations).length, theme);
          });
        });
      }

      // Both menus behave alike: one open at a time, and anything else closes
      // them - a click outside, Escape, or picking something.
      function reveal(button, panel, open) {
        panel.hidden = !open;
        button.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      function close() {
        reveal(toggle, menu, false);
        reveal(options, optionsMenu, false);
      }

      toggle.onclick = function (event) {
        event.stopPropagation();
        var open = menu.hidden;
        close();
        if (!open) return;

        // Fetched the first time the menu is opened: it is far larger than the
        // map, and most of the time nobody asks for it.
        var ready = themes ? Promise.resolve() : d3.json('./categories.json').then(function (loaded) {
          themes = loaded;
          buildMenu();
        });

        ready.then(function () { reveal(toggle, menu, true); });
      };

      options.onclick = function (event) {
        event.stopPropagation();
        var open = optionsMenu.hidden;
        close();
        reveal(options, optionsMenu, open);
      };

      overgroundBox.onchange = function () {
        overground = overgroundBox.checked;
        draw(true);
      };

      // The line colours are painted into the drawing, so the theme is not
      // something the stylesheet can finish on its own.
      darkBox.onchange = function () {
        dark = darkBox.checked;
        document.body.classList.toggle('dark', dark);
        draw(true);
      };

      document.addEventListener('click', function (event) {
        if (!menu.contains(event.target) && !optionsMenu.contains(event.target)) close();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') close();
      });

      darkBox.checked = dark;
      document.body.classList.toggle('dark', dark);

      d3.json('./map.json').then(function (loaded) {
        data = loaded;
        Object.keys(data.stations).forEach(function (key) {
          names[key] = data.stations[key].label;
        });

        map.on('click', function (key) {
          var station = data.stations[key];
          var named = showing && showing.stations[key];
          var title = named ? named.person : station.label.replace(/\n/g, ' ');
          var under = named
            ? named.role + ' &middot; ' + named.distance_m + 'm from ' +
              names[key].replace(/\n/g, ' ')
            : station.uid + ' &middot; ' + station.lat.toFixed(4) + ', ' + station.lon.toFixed(4);
          var image = named && named.person_image
            ? '<img class="portrait" width="56" height="56" src="' + named.person_image + '" alt="" />'
            : '';

          selection.html(image + '<div class="copy"><div class="name">' + title + '</div><div class="hint">' + under + '</div>' +
            (named && named.wikipedia
              ? '<a class="more" target="_blank" rel="noopener" href="' + named.wikipedia + '">Wikipedia</a>'
              : '') + '</div>');
        });

        draw(false);
        window.addEventListener('resize', function () { fit(); });
      });
    </script>
  </body>
</html>
